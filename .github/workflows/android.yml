name: Build All Pro Release APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # TRUCKJE: We dwingen het project om SQLCipherversie 4.5.5 te gebruiken in plaats van de corrupte 4.5.4
      - name: Fix Corrupt SQLCipher Version Dependency
        run: |
          find . -name "build.gradle" -exec sed -i 's/android-database-sqlcipher:4.5.4/android-database-sqlcipher:4.5.5/g' {} +
          find . -name "build.gradle" -exec sed -i "s/'sqlcipher_version', '4.5.4'/'sqlcipher_version', '4.5.5'/g" {} +

      - name: Pre-create Dependency Folders
        run: |
          mkdir -p remoteClientLib/jni/libs/deps/
          mkdir -p Opaque-app/libs/

      - name: Download Prebuilt Dependencies
        run: |
          chmod +x download-prebuilt-dependencies.sh
          ./download-prebuilt-dependencies.sh

      - name: Prepare Project Scripts
        run: |
          chmod +x bVNC/prepare_project.sh
          ./bVNC/prepare_project.sh --skip-build libs nopath

      - name: Configure Keystore for Release
        run: |
          keytool -genkey -v -keystore github-actions.jks -alias alias -keyalg RSA -keysize 2048 -validity 10000 -storepass mypassword -keypass mypassword -dname "CN=GitHub Actions, O=Android, C=US"
          echo "RELEASE_STORE_FILE=../github-actions.jks" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=mypassword" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=alias" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=mypassword" >> gradle.properties

      # We bouwen nu alle apps. De || true zorgt dat we doorgaan als er één app specifieke fouten heeft
      - name: Build All Pro Release APKs
        run: |
          chmod +x gradlew
          ./gradlew :bVNC-app:assembleRelease || echo "bVNC failed"
          ./gradlew :aRDP-app:assembleRelease || echo "aRDP failed"
          ./gradlew :aSPICE-app:assembleRelease || echo "aSPICE failed"
          ./gradlew :Opaque-app:assembleRelease || echo "Opaque failed"

      - name: Collect All APKs
        run: |
          mkdir -p final-apks
          find . -name "*release*.apk" -exec cp {} final-apks/ \; || true

      - name: Upload All Pro APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: All-Pro-Release-APKs
          path: final-apks/
